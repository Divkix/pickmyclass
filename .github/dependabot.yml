version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    ignore:
      # vite-plus ships as 3 lockstep packages: vite-plus (cli) plus the
      # npm-aliased vite (@voidzero-dev/vite-plus-core) and vitest
      # (@voidzero-dev/vite-plus-test). Dependabot only sees vite-plus by
      # name and can't track/group the aliases, so a solo vite-plus bump
      # desyncs the trio and breaks CI. Bump all three manually in lockstep.
      - dependency-name: 'vite-plus'
    groups:
      # Group all minor/patch updates
      all-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'dependencies'
