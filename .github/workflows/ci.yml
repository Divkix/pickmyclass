name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Run full verification
        run: pnpm run verify

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Run tests with coverage
        run: pnpm run test:coverage

  db:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Start PostgreSQL
        run: docker run -d --name postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:18

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Wait for PostgreSQL
        run: |
          for _ in {1..30}; do
            if docker exec postgres pg_isready -h 127.0.0.1 -U postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs postgres
          exit 1

      - name: Migrate database
        run: pnpm run db:migrate

      - name: Run database tests
        run: pnpm run test:db

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, test, db, build]
    if: always() && !cancelled()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.db.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed successfully"
