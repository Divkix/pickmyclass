name: Dependabot Automerge

# `pull_request_target`, not `pull_request`: the job must run the copy of this
# file that lives on the default branch, so a PR cannot edit the gate that
# decides whether the PR may merge. Nothing here checks out, installs, builds
# or executes anything from the PR — it only reads the REST API and, when every
# gate passes, merges the PR through `gh pr merge`.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  # `actions: read` is required by the self-identity lookup
  # (`/actions/runs/<id>` and `/actions/workflows/<id>/runs`); without it the
  # runtime GITHUB_TOKEN cannot call the Actions API.
  actions: read
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Automerge Dependabot
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # This run, used to identify the gate's own check run (never a name alone).
      SELF_RUN_ID: ${{ github.run_id }}
      # Checks that must be present AND successful. `CI Success` is the CI
      # workflow's rollup job; the other two are the required checks on `main`.
      REQUIRED_CHECKS: "CI Success,GitGuardian Security Checks,Workers Builds: pickmyclass"
      # This job's own check run, excluded so the gate cannot deadlock on itself.
      # Must match the job `name:` above.
      SELF_CHECK: Automerge Dependabot
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0 (tag verified: commit 25dd0e34, node24)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors are never auto-merged, but they should not sit unreviewed either.
      # `update-type` output values are namespaced, e.g. "version-update:semver-minor".
      - name: Request review for major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" --add-reviewer Divkix
          echo "::notice::major update — review requested from Divkix; not auto-merging"

      - name: Gate and merge minor/patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          # Flip to true to run the whole gate without merging.
          DRY_RUN: "false"
        run: |
          set -euo pipefail

          : "${REPO:?}" "${PR_NUMBER:?}" "${EVENT_HEAD_SHA:?}" "${UPDATE_TYPE:?}" \
            "${REQUIRED_CHECKS:?}" "${SELF_CHECK:?}" "${SELF_RUN_ID:?}"
          DRY_RUN="${DRY_RUN:-true}"
          POLL_INTERVAL_SECONDS="${POLL_INTERVAL_SECONDS:-15}"
          TIMEOUT_SECONDS="${TIMEOUT_SECONDS:-2700}"

          case "$UPDATE_TYPE" in
            version-update:semver-minor | version-update:semver-patch) ;;
            *)
              echo "refusing to merge: update type '$UPDATE_TYPE' is not a minor or patch version update"
              exit 1
              ;;
          esac

          # The gate must not wait on, or be satisfied by, its own check run.
          # Identify its workflow once (invariant) through this run, then exclude
          # only check runs from suites that workflow created for this commit — a
          # same-named check run from any other workflow still gates the merge.
          # Both calls are Actions API reads, hence `actions: read` above.
          self_workflow_id=$(gh api "repos/$REPO/actions/runs/$SELF_RUN_ID" --jq '.workflow_id')
          echo "gating $REPO#$PR_NUMBER ($UPDATE_TYPE, head $EVENT_HEAD_SHA)"
          echo "required checks: $REQUIRED_CHECKS"
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))

          # Revalidated on every poll and once more immediately before merging, so
          # a retargeted, re-drafted, re-authored or re-pushed PR cannot merge.
          # 0 = still the PR this run gated, 2 = already merged, 1 = refuse.
          validate_pr() {
            local json="$1" author head_repo head_sha base_ref state draft merged
            author=$(jq -r '.user.login // ""' <<<"$json")
            head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$json")
            head_sha=$(jq -r '.head.sha // ""' <<<"$json")
            base_ref=$(jq -r '.base.ref // ""' <<<"$json")
            state=$(jq -r '.state // ""' <<<"$json")
            draft=$(jq -r '.draft' <<<"$json")
            merged=$(jq -r '.merged' <<<"$json")

            [ "$merged" = "false" ] || { echo "nothing to do: pull request is already merged"; return 2; }
            [ "$author" = "dependabot[bot]" ] || { echo "refusing: author '$author' is not dependabot[bot]"; return 1; }
            [ "$head_repo" = "$REPO" ] || { echo "refusing: head repository '$head_repo' is not $REPO"; return 1; }
            [ "$base_ref" = "main" ] || { echo "refusing: base branch is '$base_ref', not main"; return 1; }
            [ "$draft" = "false" ] || { echo "refusing: pull request is a draft"; return 1; }
            [ "$state" = "open" ] || { echo "refusing: pull request state is '$state'"; return 1; }
            [ "$head_sha" = "$EVENT_HEAD_SHA" ] ||
              { echo "refusing: head moved to $head_sha while this run gated $EVENT_HEAD_SHA"; return 1; }
            return 0
          }

          while :; do
            pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
            rc=0
            validate_pr "$pr" || rc=$?
            if [ "$rc" -eq 2 ]; then exit 0; fi
            [ "$rc" -eq 0 ] || exit 1

            # --paginate + NDJSON so a rollup longer than one page cannot hide a
            # failing check behind per_page.
            self_suites=$(gh api --paginate \
              "repos/$REPO/actions/workflows/$self_workflow_id/runs?head_sha=$EVENT_HEAD_SHA&per_page=100" \
              --jq '.workflow_runs[].check_suite_id' | jq -s '.')
            checks=$(gh api --paginate "repos/$REPO/commits/$EVENT_HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[]' |
              jq -s --argjson suites "$self_suites" --arg self "$SELF_CHECK" '
                [ .[] as $c
                  | select(($suites | index($c.check_suite.id)) == null or $c.name != $self)
                  | $c ]')
            statuses=$(gh api --paginate "repos/$REPO/commits/$EVENT_HEAD_SHA/statuses?per_page=100" --jq '.[]' | jq -s '.')

            # Only an exact `success` passes. skipped, neutral, cancelled,
            # timed_out and action_required all refuse the merge.
            failed=$(
              jq -r '[ .[] | select(.status == "completed") | select(.conclusion != "success") | "\(.name)=\(.conclusion)" ] | join(", ")' <<<"$checks"
            )
            if [ -n "$failed" ]; then
              echo "refusing: non-successful check runs: $failed"
              exit 1
            fi

            failed_statuses=$(
              jq -r '[ .[] | select(.state == "failure" or .state == "error") | "\(.context)=\(.state)" ] | join(", ")' <<<"$statuses"
            )
            if [ -n "$failed_statuses" ]; then
              echo "refusing: non-successful commit statuses: $failed_statuses"
              exit 1
            fi

            missing=""
            IFS=',' read -r -a required <<<"$REQUIRED_CHECKS"
            for name in "${required[@]}"; do
              ok=$(
                jq -r --arg n "$name" '
                  [ .[] | select(.name == $n) | select(.status == "completed" and .conclusion == "success") ] | length
                ' <<<"$checks"
              )
              [ "$ok" != "0" ] || missing="${missing:+$missing, }$name"
            done

            running=$(jq -r '[ .[] | select(.status != "completed") | .name ] | join(", ")' <<<"$checks")
            running_statuses=$(
              jq -r '[ .[] | select(.state != "success" and .state != "failure" and .state != "error") | .context ] | join(", ")' <<<"$statuses"
            )

            if [ -z "$missing" ] && [ -z "$running" ] && [ -z "$running_statuses" ]; then
              break
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "timed out after ${TIMEOUT_SECONDS}s waiting on:"
              echo "  missing required checks: ${missing:-none}"
              echo "  check runs still running: ${running:-none}"
              echo "  commit statuses still pending: ${running_statuses:-none}"
              exit 1
            fi

            echo "waiting ${POLL_INTERVAL_SECONDS}s — missing: ${missing:-none}; running: ${running:-none}; pending statuses: ${running_statuses:-none}"
            sleep "$POLL_INTERVAL_SECONDS"
          done

          echo "all required checks green; every other observed check and status is an exact success"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY_RUN=true — gate passed, skipping 'gh pr merge'"
            exit 0
          fi

          # Final read of the same facts, then merge. `--match-head-commit` makes
          # the API itself refuse if the head moves between this read and the
          # merge; the branch is deleted by `delete_branch_on_merge`, so no
          # `--delete-branch` that could race that deletion.
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          rc=0
          validate_pr "$pr" || rc=$?
          if [ "$rc" -eq 2 ]; then exit 0; fi
          [ "$rc" -eq 0 ] || { echo "refusing: pull request changed before merging"; exit 1; }

          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash \
            --match-head-commit "$EVENT_HEAD_SHA"

      # Any other verdict (empty output, "unknown", a future type) is a miss,
      # not a pass: report it and leave the PR alone.
      - name: Fail closed on an unexpected update type
        if: |
          steps.metadata.outputs.update-type != 'version-update:semver-minor' &&
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "::error::update type '${UPDATE_TYPE:-<empty>}' is not a minor or patch version update; not merging"
          exit 1
