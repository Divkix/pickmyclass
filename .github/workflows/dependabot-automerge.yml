name: Dependabot Automerge

# `pull_request_target`, not `pull_request`: the job must run the copy of this
# file that lives on the default branch, so a PR cannot edit the gate that
# decides whether the PR may merge. Nothing here checks out, installs, builds
# or executes anything from the PR — it only reads the REST API and, when every
# gate passes, merges the PR through `gh pr merge`.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Automerge Dependabot
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Checks that must be present AND successful. `CI Success` is the CI
      # workflow's rollup job; the other two are the required checks on `main`.
      REQUIRED_CHECKS: "CI Success,GitGuardian Security Checks,Workers Builds: pickmyclass"
      # This job's own check run, excluded so the gate cannot deadlock on itself.
      # Must match the job `name:` above.
      SELF_CHECK: Automerge Dependabot
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7 # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors are never auto-merged, but they should not sit unreviewed either.
      - name: Request review for major updates
        if: steps.metadata.outputs.update-type == 'semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" --add-reviewer Divkix
          echo "::notice::major update — review requested from Divkix; not auto-merging"

      - name: Gate and merge minor/patch updates
        if: |
          steps.metadata.outputs.update-type == 'semver-minor' ||
          steps.metadata.outputs.update-type == 'semver-patch'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          # Flip to true to run the whole gate without merging.
          DRY_RUN: "false"
        run: |
          set -euo pipefail

          : "${REPO:?}" "${PR_NUMBER:?}" "${EVENT_HEAD_SHA:?}" "${UPDATE_TYPE:?}" \
            "${REQUIRED_CHECKS:?}" "${SELF_CHECK:?}"
          DRY_RUN="${DRY_RUN:-true}"
          POLL_INTERVAL_SECONDS="${POLL_INTERVAL_SECONDS:-15}"
          TIMEOUT_SECONDS="${TIMEOUT_SECONDS:-2700}"

          case "$UPDATE_TYPE" in
            semver-minor | semver-patch) ;;
            *)
              echo "refusing to merge: update type '$UPDATE_TYPE' is not semver-minor or semver-patch"
              exit 1
              ;;
          esac

          echo "gating $REPO#$PR_NUMBER ($UPDATE_TYPE, head $EVENT_HEAD_SHA)"
          echo "required checks: $REQUIRED_CHECKS"
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))

          while :; do
            pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
            # --paginate + NDJSON so a rollup longer than one page cannot hide a
            # failing check behind per_page.
            checks=$(gh api --paginate "repos/$REPO/commits/$EVENT_HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '.')
            statuses=$(gh api --paginate "repos/$REPO/commits/$EVENT_HEAD_SHA/statuses?per_page=100" --jq '.[]' | jq -s '.')

            author=$(jq -r '.user.login // ""' <<<"$pr")
            head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
            head_sha=$(jq -r '.head.sha // ""' <<<"$pr")
            base_ref=$(jq -r '.base.ref // ""' <<<"$pr")
            state=$(jq -r '.state // ""' <<<"$pr")
            draft=$(jq -r '.draft' <<<"$pr")
            merged=$(jq -r '.merged' <<<"$pr")

            # Re-checked here as well as in the job condition: the gate must be
            # impossible to satisfy by anything but a same-repo, non-draft,
            # dependabot-authored PR against main, even if the two drift.
            [ "$author" = "dependabot[bot]" ] || { echo "refusing: author '$author' is not dependabot[bot]"; exit 1; }
            [ "$head_repo" = "$REPO" ] || { echo "refusing: head repository '$head_repo' is not $REPO"; exit 1; }
            [ "$base_ref" = "main" ] || { echo "refusing: base branch is '$base_ref', not main"; exit 1; }
            [ "$draft" = "false" ] || { echo "refusing: pull request is a draft"; exit 1; }
            [ "$merged" = "false" ] || { echo "nothing to do: pull request is already merged"; exit 0; }
            [ "$state" = "open" ] || { echo "refusing: pull request state is '$state'"; exit 1; }
            [ "$head_sha" = "$EVENT_HEAD_SHA" ] ||
              { echo "refusing: head moved to $head_sha while this run gated $EVENT_HEAD_SHA"; exit 1; }

            failed=$(
              jq -r --arg self "$SELF_CHECK" '
                [ .[]
                  | select(.name != $self)
                  | select(.status == "completed")
                  | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")
                  | "\(.name)=\(.conclusion)" ] | join(", ")
              ' <<<"$checks"
            )
            if [ -n "$failed" ]; then
              echo "refusing: non-successful check runs: $failed"
              exit 1
            fi

            failed_statuses=$(
              jq -r '[ .[] | select(.state == "failure" or .state == "error") | "\(.context)=\(.state)" ] | join(", ")' <<<"$statuses"
            )
            if [ -n "$failed_statuses" ]; then
              echo "refusing: non-successful commit statuses: $failed_statuses"
              exit 1
            fi

            missing=""
            IFS=',' read -r -a required <<<"$REQUIRED_CHECKS"
            for name in "${required[@]}"; do
              ok=$(
                jq -r --arg n "$name" '
                  [ .[] | select(.name == $n) | select(.status == "completed" and .conclusion == "success") ] | length
                ' <<<"$checks"
              )
              [ "$ok" != "0" ] || missing="${missing:+$missing, }$name"
            done

            running=$(
              jq -r --arg self "$SELF_CHECK" '
                [ .[] | select(.name != $self) | select(.status != "completed") | .name ] | join(", ")
              ' <<<"$checks"
            )
            running_statuses=$(
              jq -r '[ .[] | select(.state == "pending") | .context ] | join(", ")' <<<"$statuses"
            )

            if [ -z "$missing" ] && [ -z "$running" ] && [ -z "$running_statuses" ]; then
              break
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "timed out after ${TIMEOUT_SECONDS}s waiting on:"
              echo "  missing required checks: ${missing:-none}"
              echo "  check runs still running: ${running:-none}"
              echo "  commit statuses still pending: ${running_statuses:-none}"
              exit 1
            fi

            echo "waiting ${POLL_INTERVAL_SECONDS}s — missing: ${missing:-none}; running: ${running:-none}; pending statuses: ${running_statuses:-none}"
            sleep "$POLL_INTERVAL_SECONDS"
          done

          echo "all required checks green; all other observed checks and statuses settled successful"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY_RUN=true — gate passed, skipping 'gh pr merge'"
            exit 0
          fi

          # Last read: the merge must apply to the commit this run gated, and
          # --match-head-commit makes the API refuse if the head moved again.
          final_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          [ "$final_sha" = "$EVENT_HEAD_SHA" ] ||
            { echo "refusing: head moved to $final_sha before merging"; exit 1; }

          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$EVENT_HEAD_SHA"

      # Any other verdict (empty output, "unknown", a future type) is a miss,
      # not a pass: report it and leave the PR alone.
      - name: Fail closed on an unexpected update type
        if: |
          steps.metadata.outputs.update-type != 'semver-minor' &&
          steps.metadata.outputs.update-type != 'semver-patch' &&
          steps.metadata.outputs.update-type != 'semver-major'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "::error::update type '${UPDATE_TYPE:-<empty>}' is neither semver-minor nor semver-patch; not merging"
          exit 1
