allowBuilds:
  "@clerk/shared": true
  "@posthog/cli": true
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
# Supply-chain hardening: hold back fresh releases and reject downgraded trust signals.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# pnpm >= 11.22 prunes exact-version excludes no longer resolved by the lockfile.
minimumReleaseAgeExcludePrune: true
# Install platform-specific native optional deps for both the CI/build host
# (Linux x64 glibc — Cloudflare Pages) and local dev (Darwin arm64/x64).
# Without this, pnpm skips @voidzero-dev/vite-plus-linux-x64-gnu on Linux and
# the `prepare` script (`vp config`) crashes with "Cannot find native binding".
supportedArchitectures:
  os:
    - linux
    - darwin
    - current
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - current
overrides:
  vite-plus: 1.0.0-rc.0
  "@vitest/coverage-v8": 5.0.1
  postcss: 8.5.26
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - posthog-js
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vitest: 5.0.1
  vite-plus: 1.0.0-rc.0
  "@vitest/coverage-v8": 5.0.1
