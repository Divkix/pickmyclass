allowBuilds:
  '@clerk/shared': true
  '@posthog/cli': true
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
confirmModulesPurge: false
minimumReleaseAge: 0
trustPolicy: no-downgrade
overrides:
  vite-plus: 0.3.1
  '@vitest/coverage-v8': 4.1.11
  postcss: 8.5.26
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
  - posthog-js
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
  '@vitest/coverage-v8': 4.1.11
