packages:
  - "."

# Install platform-specific native optional deps for both the CI/build host
# (Linux x64 glibc — Cloudflare Pages) and local dev (Darwin arm64/x64).
# Without this, pnpm skips @voidzero-dev/vite-plus-linux-x64-gnu on Linux and
# the `prepare` script (`vp config`) crashes with "Cannot find native binding".
supportedArchitectures:
  os:
    - linux
    - darwin
    - current
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - current

overrides:
  # Vite+ ships its own Vitest and refuses `--coverage` unless the installed
  # coverage provider is that exact version (a mismatch otherwise fails CI at
  # startup). Both go through the catalog so the override and the devDependency
  # can never drift apart.
  "@vitest/coverage-v8": "catalog:"
  vite-plus: "catalog:"
  postcss: "^8.5.29"
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  "@clerk/shared": true
  "@posthog/cli": true
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^1.1.0
  vitest: ^5.0.3
  vite-plus: ^1.1.0
  "@vitest/coverage-v8": ^5.0.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Supply-chain hardening: refuse any version whose trust signals (provenance,
# signatures) regressed versus what we already resolved. Releases too fresh to
# have been vetted are held back by pnpm's built-in `minimumReleaseAge` default
# (1440 minutes), which stays unset on purpose: that default is non-strict, so
# a range that only a same-day release satisfies still resolves.
trustPolicy: no-downgrade
