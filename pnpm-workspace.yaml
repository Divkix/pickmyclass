allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
confirmModulesPurge: false
minimumReleaseAge: 0
overrides:
  vite: 'catalog:'
  vite-plus: 0.2.3
  vitest: 'catalog:'
  '@vitest/coverage-v8': 4.1.10
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.3
  vitest: 4.1.10
  vite-plus: latest
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
