allowBuilds:
  '@clerk/shared': true
  '@posthog/cli': true
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAge: 0
trustPolicy: no-downgrade
overrides:
  vite-plus: 1.0.0-rc.0
  '@vitest/coverage-v8': 5.0.1
  postcss: 8.5.26
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
  - posthog-js
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vitest: 5.0.1
  vite-plus: 1.0.0-rc.0
  '@vitest/coverage-v8': 5.0.1
