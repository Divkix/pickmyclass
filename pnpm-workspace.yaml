# pnpm 12 lockfiles have two YAML documents: environment, then project. Regenerate
# pnpm-lock.yaml after changing package.json's packageManager or frozen installs fail.
# pnpm 12 rejects unknown workspace keys; use supported settings rather than old aliases.
#
# Keep dependency ranges as carets; only packageManager and @hyperdx/browser are exact pins.
# `pnpm update --latest` preserves catalog references and updates their entries.
packages:
  - "."

# Install platform-specific native optional deps for both the CI/build host
# (Linux x64 glibc — Cloudflare Pages) and local dev (Darwin arm64/x64).
# Without this, pnpm skips @voidzero-dev/vite-plus-linux-x64-gnu on Linux and
# the `prepare` script (`vp config`) crashes with "Cannot find native binding".
supportedArchitectures:
  os:
    - linux
    - darwin
    - current
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - current

overrides:
  # Vite+ ships its own Vitest and refuses `--coverage` unless the installed
  # coverage provider is that exact version (a mismatch otherwise fails CI at
  # startup). Both go through the catalog so the override and the devDependency
  # can never drift apart.
  "@vitest/coverage-v8": "catalog:"
  vite-plus: "catalog:"
  postcss: "^8.5.29"
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  "@clerk/shared": true
  core-js: true
  esbuild: true
  # Its postinstall only checks the optional protobufjs CLI, which nothing uses.
  protobufjs: false
  sharp: true
  workerd: true
# Bump vite-plus, vite, vitest and @vitest/* together here; solo bumps break types/coverage.
# Match coverage-v8 to Vite+'s bundled Vitest (`vp --version`), not an independent latest.
# Avoid `vp migrate`: it replaces the catalog references with exact pins.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^1.3.0
  vitest: ^5.0.5
  vite-plus: ^1.3.0
  "@vitest/coverage-v8": ^5.0.5
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Permanent supply-chain policy: refuse regressed provenance/signature trust signals.
# pnpm's default, non-strict 1440-minute minimumReleaseAge still applies.
#
# Exact versions admitted by the 2026-10-22 one-shot security upgrade while
# younger than that window. Version-pinned so future releases of these packages
# stay gated; safe to delete once these versions age in.
minimumReleaseAgeExclude:
  - "@clerk/backend@3.26.1"
  - "caniuse-lite@1.0.30001818"
  - "lucide-react@1.61.0"
trustPolicy: no-downgrade
# semver@6.3.1 predates npm provenance, so it reads as a downgrade next to the
# provenance-signed 7.x line. Babel (TanStack Start's route compiler) still
# depends on 6.x; exclude that exact version only.
trustPolicyExclude:
  - "semver@6.3.1"
# @hyperdx/browser prebundles its session recorder, whose log batcher flushes on
# `unload`: Chrome blocks that by default and Lighthouse flags it (deprecated API
# + console error). The patch listens on `pagehide`. Port or drop it on every bump.
patchedDependencies:
  "@hyperdx/browser@0.26.0": patches/@hyperdx__browser@0.26.0.patch
