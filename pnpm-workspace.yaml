packages:
  - "."

# Install platform-specific native optional deps for both the CI/build host
# (Linux x64 glibc — Cloudflare Pages) and local dev (Darwin arm64/x64).
# Without this, pnpm skips @voidzero-dev/vite-plus-linux-x64-gnu on Linux and
# the `prepare` script (`vp config`) crashes with "Cannot find native binding".
supportedArchitectures:
  os:
    - linux
    - darwin
    - current
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - current

overrides:
  # Vite+ 1.0.0-rc.0 bundles Vitest 5.0.1 and refuses to run `--coverage` unless
  # the installed coverage provider is the exact same version (mixed versions
  # otherwise fails CI at startup).
  "@vitest/coverage-v8": 5.0.1
  vite-plus: 1.0.0-rc.0
  postcss: 8.5.26
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  "@clerk/shared": true
  "@posthog/cli": true
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vitest: 5.0.1
  vite-plus: 1.0.0-rc.0
  "@vitest/coverage-v8": 5.0.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Supply-chain hardening: refuse any version whose trust signals (provenance,
# signatures) regressed versus what we already resolved, and hold back releases
# that are too fresh to have been vetted.
#
# `minimumReleaseAge` holds releases for 1 day (pnpm's default, made strict by
# setting it explicitly); bump a dependency sooner by adding it to
# `minimumReleaseAgeExclude`.
trustPolicy: no-downgrade
minimumReleaseAge: 1440
# pnpm >= 11.22 prunes exact-version excludes no longer resolved by the lockfile.
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - posthog-js
