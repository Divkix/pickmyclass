allowBuilds:
  '@clerk/shared': true
  '@posthog/cli': true
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
confirmModulesPurge: false
minimumReleaseAge: 0
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.9
  vite-plus: 0.2.9
  vitest: 4.1.10
  '@vitest/coverage-v8': 4.1.10
  postcss: 8.5.26
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
  - posthog-js
